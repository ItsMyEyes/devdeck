name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Go vet
        run: cd backend && go vet ./...

      - name: Go test
        run: cd backend && go test ./...

      # This job gates build-desktop and release, so it is the last chance to
      # catch a broken latest.json before a tag ships one to every client.
      - name: Updater manifest generator tests
        run: node --test scripts/gen-latest-json.test.mjs

      - name: Frontend install
        run: cd frontend && npm ci

      - name: Frontend typecheck
        run: cd frontend && npm run typecheck

  # Hub + runtime are the same binary, selected at runtime via --role — one
  # cross-compiled matrix covers both deployment environments.
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend install
        run: cd frontend && npm ci

      # Explicit for the same reason the desktop job passes it: the version a
      # release ships must come from the tag, never from whatever `git describe`
      # infers about the tree it happens to be building in.
      - name: Build portable binaries (hub + runtime)
        run: make portable-all
        env:
          VERSION: ${{ github.ref_name }}

      # Same binary runs as --role hub, runtime, or both — "-runtime" in the
      # release asset name signals "this is the server binary", distinct
      # from the "-desktop" Tauri app bundles built below.
      - name: Rename binaries for release
        run: |
          cd dist
          for f in devdeck-*; do mv "$f" "devdeck-runtime-${f#devdeck-}"; done

      # The install scripts verify this manifest before putting anything on
      # disk. Generated after the rename so the names in checksums.txt are
      # the names the release actually publishes.
      - name: Generate checksums
        run: cd dist && sha256sum devdeck-runtime-* > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: |
            dist/devdeck-runtime-*
            dist/checksums.txt
          if-no-files-found: error

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        # updaterPlatform / updaterAsset feed the latest.json fragment this job
        # emits (spec D5). updaterAsset must match the renamed release asset
        # exactly — it becomes the download URL the updater fetches.
        include:
          - platform: macos-latest
            updaterPlatform: darwin-aarch64
            updaterAsset: devdeck-desktop-macos-aarch64.app.tar.gz
          - platform: ubuntu-latest
            updaterPlatform: linux-x86_64
            updaterAsset: devdeck-desktop-linux-amd64.AppImage
          - platform: windows-latest
            updaterPlatform: windows-x86_64
            updaterAsset: devdeck-desktop-windows-amd64-setup.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Frontend install
        run: cd frontend && npm ci

      # tauri.conf.json is committed at 0.1.0 and nothing else writes the tag
      # into it. The updater compares latest.json's `version` against the value
      # baked into the installed bundle — without this stamp every install
      # reports 0.1.0 forever and re-offers the update it just applied (D4).
      - name: Stamp release version into tauri.conf.json
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "frontend/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.version = process.env.RELEASE_TAG.replace(/^v/, "");
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
            console.log("tauri.conf.json version = " + conf.version);
          '

      # beforeBuildCommand (tauri.conf.json) runs `make prepare-sidecar`,
      # which cross-compiles the Go sidecar binaries with the host's Go
      # toolchain — no per-platform C toolchain needed for that step.
      #
      # TAURI_SIGNING_* make `tauri build` emit a minisign `.sig` beside each
      # updater artifact. They are consumed by the bundler only; nothing here
      # ever echoes or logs them.
      #
      # VERSION is passed explicitly because the stamp step above edited a
      # TRACKED file. The Makefile's default is `git describe --tags --dirty`,
      # which in this now-dirty tree yields `<tag>-dirty` and would bake that
      # into all three sidecars shipped inside the bundle. `selfupdate.NeedsUpdate`
      # sorts a prerelease below its release, so those runtimes would report an
      # update available against their own tag forever — unfixable once tagged.
      - name: Build desktop bundle
        run: cd frontend && npm run tauri:build
        env:
          VERSION: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # "-desktop" in the release asset name distinguishes these Tauri app
      # installers from the "-runtime" server binaries built above.
      #
      # The .app.tar.gz is the macOS updater artifact (D5) — the only new asset
      # the updater needs; Linux reuses its .AppImage and Windows its
      # -setup.exe. Renaming it breaks the `<asset>.sig` name pairing, which is
      # why the fragment below carries signature content instead of a filename.
      - name: Rename macOS bundles
        if: matrix.platform == 'macos-latest'
        run: |
          mv frontend/src-tauri/target/release/bundle/dmg/*.dmg frontend/src-tauri/target/release/bundle/dmg/devdeck-desktop-macos-aarch64.dmg
          mv frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz frontend/src-tauri/target/release/bundle/macos/devdeck-desktop-macos-aarch64.app.tar.gz

      - name: Rename Linux bundles
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mv frontend/src-tauri/target/release/bundle/deb/*.deb frontend/src-tauri/target/release/bundle/deb/devdeck-desktop-linux-amd64.deb
          mv frontend/src-tauri/target/release/bundle/rpm/*.rpm frontend/src-tauri/target/release/bundle/rpm/devdeck-desktop-linux-amd64.rpm
          mv frontend/src-tauri/target/release/bundle/appimage/*.AppImage frontend/src-tauri/target/release/bundle/appimage/devdeck-desktop-linux-amd64.AppImage

      - name: Rename Windows bundles
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mv frontend/src-tauri/target/release/bundle/msi/*.msi frontend/src-tauri/target/release/bundle/msi/devdeck-desktop-windows-amd64.msi
          mv frontend/src-tauri/target/release/bundle/nsis/*.exe frontend/src-tauri/target/release/bundle/nsis/devdeck-desktop-windows-amd64-setup.exe

      # Reads the .sig Tauri wrote next to the bundle and records its CONTENT,
      # so the merge job never has to glob for a signature whose name no longer
      # matches its (renamed) asset. Prints no signature material.
      - name: Write updater fragment
        shell: bash
        run: |
          node scripts/gen-latest-json.mjs fragment \
            --platform '${{ matrix.updaterPlatform }}' \
            --bundle-dir frontend/src-tauri/target/release/bundle \
            --asset-name '${{ matrix.updaterAsset }}' \
            --out updater-fragment.json

      - name: Upload updater fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.updaterPlatform }}
          path: updater-fragment.json
          if-no-files-found: error

      - name: Upload macOS bundle
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

      - name: Upload Linux bundle
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows bundle
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [build-backend, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The hand-written "what changed" summary lives in CHANGELOG.md, one
      # `## vX.Y.Z` section per tag. Pull this tag's section out as the release
      # body; generate_release_notes below appends the commit list under it.
      # A tag with no section still releases — it just gets the commit list.
      - name: Extract release notes for this tag
        run: |
          awk -v ver="## ${GITHUB_REF_NAME}" '
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG.md section for ${GITHUB_REF_NAME}"
            echo "See the commit list below." > release-notes.md
          fi
          cat release-notes.md

      # Merges the three per-platform fragments into the manifest the Tauri
      # updater fetches (D5). A missing fragment fails the release rather than
      # publishing a latest.json that silently strands one platform's users.
      # The fragments themselves are not released — only latest.json is.
      - name: Generate latest.json
        run: |
          node scripts/gen-latest-json.mjs merge \
            --tag "${GITHUB_REF_NAME}" \
            --notes release-notes.md \
            --fragments-dir artifacts \
            --out latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/backend-binaries/**/*
            artifacts/desktop-macos/**/*
            artifacts/desktop-linux/**/*
            artifacts/desktop-windows/**/*
            latest.json
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
