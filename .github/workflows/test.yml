name: Test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Go vet
        run: cd backend && go vet ./...

      - name: Go test
        run: cd backend && go test ./...

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Shellcheck installer
        run: shellcheck -s sh scripts/install.sh scripts/test/install_test.sh

      - name: Installer unit tests
        run: sh scripts/test/install_test.sh

      # ubuntu-latest ships pwsh but not the Windows-only LOCALAPPDATA/APPDATA
      # that install.ps1 reads for its path defaults. The test script stands
      # those in itself, so this step needs no env plumbing.
      - name: PowerShell installer tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test/install_ps_test.ps1

      - name: Frontend install
        run: cd frontend && npm ci

      - name: Frontend typecheck
        run: cd frontend && npm run typecheck
