<!doctype html>
<!-- `dark` is the pre-script default: it is what DevDeck looked like before the
     appearance setting existed, and what a user with no stored preference still
     gets. The inline script below may swap it before first paint. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the stored choice before the app bundle loads to avoid a theme
         flash. theme.guard.test.ts exercises this script against the resolver. -->
    <script>
      (function () {
        var preference = 'dark'
        try {
          var stored = localStorage.getItem('devdeck.appearance.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch (_) {}
        var resolved = preference
        if (preference === 'system') {
          try {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (_) {
            resolved = 'dark'
          }
        }
        var root = document.documentElement
        root.classList.toggle('dark', resolved === 'dark')
        root.classList.toggle('light', resolved === 'light')
        root.style.colorScheme = resolved
      })()
    </script>
    <!-- interactive-widget=resizes-content: on Android Chrome, resize the
         layout viewport (and visualViewport) when the on-screen keyboard
         opens instead of just overlaying it, so useViewportHeight's
         --app-height tracks the actually-visible area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="icon" type="image/png" href="/devdeck-logo.png" />
    <title>devdeck — one operator, many companies</title>
    <!-- UI text is the platform's own interface face (SF Pro / Segoe UI
         Variable / system-ui — installed, nothing to fetch); only the
         monospace face, used by code blocks, diffs and the terminal, is a
         webfont. See --font-sans / --font-mono in styles/globals.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
