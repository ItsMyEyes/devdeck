[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Tauri's own size guide (https://v2.tauri.app/concept/size/): none of this
# was set before, so every release shipped the Cargo defaults (opt-level=3,
# no LTO, no strip, 16 codegen-units) — a needlessly large, non-stripped
# shell binary bundled into every desktop install. Scoped to [profile.release]
# only, so `cargo test`/dev builds (and their unwinding-based tests) are
# unaffected by panic = "abort".
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Native "where do you want to save this?" dialog + the write that follows it.
# The webview has no working alternative: WKWebView has no showSaveFilePicker,
# and an `<a download>` on a blob: URL is swallowed outright because wry only
# installs a WKDownloadDelegate when a download handler is registered. Both
# plugins are needed together — dialog's `save()` returns a path *and* adds it
# to the fs scope for the session, which is what makes fs's write_file legal
# for a location the user picked at runtime. See frontend/src/lib/saveFile.ts.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Desktop auto-update. The Go sidecar's own selfupdate refuses to run when
# `managed` (it lives inside the signed bundle, so overwriting it in place
# invalidates the bundle and races the respawn loop), which left the desktop
# app with no way to update at all — the About panel could report a new
# version and offer nothing. This plugin updates the whole .app/.exe/.AppImage,
# sidecar included, verified against the minisign pubkey in tauri.conf.json.
# See docs/superpowers/specs/2026-08-24-desktop-auto-update-design.md.
tauri-plugin-updater = "2"
getrandom = "0.4"
tokio = { version = "1", features = ["time", "signal", "macros", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Enumerates this device's network interfaces for the Settings › Network bind
# picker. std::net has no interface enumeration at all, and the alternatives
# (parsing `ifconfig`/`ip`/`ipconfig`) differ per platform and per locale.
if-addrs = "0.15"

# `Window::add_child` (unstable) and `WebviewBuilder::proxy_url` (macos-proxy)
# back the machine-proxied Browser tab's native child webviews. macos-proxy
# only compiles for macOS 14+ — Cargo unions this feature into the base
# `tauri` dependency above when building for macOS, leaving other platforms
# unaffected. See
# docs/superpowers/specs/2026-07-13-desktop-proxied-browser-tab-design.md.
#
# `macos-private-api` is required for `transparent`/`windowEffects` in
# tauri.macos.conf.json to actually render — without it the window silently
# falls back to an opaque black surface instead of compositing the sidebar
# vibrancy material. This is the same private-API tradeoff noted in Tauri's
# own docs: it disqualifies the bundle from Mac App Store distribution,
# which DevDeck (sidecar binary, custom PTY/WebSocket transport) was never
# going to pursue anyway.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.3", features = ["unstable", "macos-proxy", "macos-private-api"] }
